name: Eden Network
description: 'Eden Network is an Ethereum MEV, block-building, and orderflow infrastructure
  project (EDEN token, launched 2021, evolving from the earlier Archer DAO relay). It
  operated a gRPC mempool streaming service, an Eden block builder and reverse proxy
  (eden-geth / eden-proxy), subgraph-backed data tooling, and a DEX API for the Ethereum
  ecosystem. The original edennetwork.io web property has since lapsed; the canonical,
  still-live developer surface is the eden-network GitHub organization and the published
  npm and Go packages. Surfaced as a portfolio company of Multicoin Capital and enriched
  from those public sources.'
